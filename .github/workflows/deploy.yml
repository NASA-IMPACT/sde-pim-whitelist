name: deploy

# On merge to a deploy branch (dev/test/prod → dev/test/prod accounts):
# build the Lambda zip (code + data), upload it to S3, and point the function at
# it via update-function-code. Static infra (bucket, Lambda, API Gateway,
# CloudFront) is provisioned separately with CDK — this workflow only ships
# code+data, so it needs minimal AWS privilege. Per-account credentials and
# targets come from the GitHub Environment selected below.
on:
  # Every push to a deploy branch (i.e. every merge into dev/test/prod) deploys.
  # No `paths:` filter: a merge must always ship, even a docs-only one, so the
  # live function never lags the branch. The job re-runs the tests first and
  # aborts before deploying if they fail, so "merge => deploy" still means
  # "merge of green code => deploy".
  push:
    branches: [dev, test, prod]
  # Allow on-demand deploys from the Actions tab (e.g. to restore live code after
  # a platform-stack redeploy reverted the Lambda to its placeholder).
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write # assume the deploy role via GitHub OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Selects the GitHub Environment whose scoped secrets (AWS_DEPLOY_ROLE_ARN,
    # CODE_BUCKET, CF_DOMAIN) and protection rules apply to this branch.
    environment: >-
      ${{ github.ref_name == 'prod' && 'prod'
          || github.ref_name == 'test' && 'test'
          || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # PR checks already ran this, but re-running on main is cheap insurance
      # that what actually ships is green.
      - name: Tests
        run: |
          uv sync --extra api
          uv run pytest -q

      - name: Build Lambda zip
        run: bash scripts/build_lambda_zip.sh

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Upload artifact to S3
        run: |
          KEY="app/${GITHUB_SHA}.zip"
          aws s3 cp app.zip "s3://${{ secrets.CODE_BUCKET }}/${KEY}"
          echo "ARTIFACT_KEY=${KEY}" >> "$GITHUB_ENV"

      - name: Update Lambda code
        run: |
          aws lambda update-function-code \
            --function-name pim-api \
            --s3-bucket "${{ secrets.CODE_BUCKET }}" \
            --s3-key "${ARTIFACT_KEY}" \
            --publish
          aws lambda wait function-updated-v2 --function-name pim-api

      - name: Smoke test through CloudFront
        env:
          CF: ${{ vars.CF_DOMAIN || secrets.CF_DOMAIN }}
        run: |
          # -E + `: ?` tolerates compact JSON ("status":"ok") and spaced ("status": "ok").
          curl -fsS "https://${CF}/health" \
            | tee /dev/stderr | grep -Eq '"status": ?"ok"'

      - name: Output deployment info
        if: success()
        # CF_DOMAIN is a public DNS name — store it as an Environment *variable*
        # (not a secret) so it prints here. If it's still a secret, GitHub masks it
        # as *** in the log.
        env:
          CF: ${{ vars.CF_DOMAIN || secrets.CF_DOMAIN }}
        run: |
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          echo "=========================================="
          echo "✅ Deployment Complete!"
          echo "=========================================="
          echo "Environment: ${{ github.ref_name }}"
          echo "AWS Account: ${ACCOUNT}"
          echo "Lambda Function: pim-api"
          echo "Commit: ${GITHUB_SHA:0:7}"
          echo ""
          echo "🌐 CloudFront Domain: https://${CF}"
          echo "❤️  Health Check: https://${CF}/health"
          echo "🔍 Records API: https://${CF}/fetch_pims_records"
          echo "📖 API Docs: https://${CF}/docs"
          echo ""
          echo "🔑 API key required (x-api-key header) — issued via API Gateway usage plan (sensitive — not printed)"
