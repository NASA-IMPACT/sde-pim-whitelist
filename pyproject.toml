[project]
name = "sde-pim-whitelist"
version = "0.1.0"
description = "Automated reconciliation of PIM whitelist files against upstream NASA sources"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "openai>=1.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pydantic>=2",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# Runtime dependencies for the read API only. Deliberately excludes the sync-only
# deps (click/openai/requests) so the Lambda zip stays lean. This is the set
# exported to requirements-lambda.txt for the deploy build.
api = [
    "fastapi>=0.110",
    "mangum>=0.17",
    "pydantic>=2",
    "pydantic-settings>=2",
]

[project.scripts]
pim-whitelist = "pim_whitelist.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pre-commit>=3.8",
    # API test/dev tooling: TestClient needs httpx; local run needs uvicorn.
    "httpx>=0.27",
    "uvicorn>=0.30",
    "fastapi>=0.110",
    "mangum>=0.17",
    "pydantic-settings>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pim_whitelist"]
