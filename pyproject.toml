[project]
name = "sde-pim-whitelist"
version = "0.1.0"
description = "Automated reconciliation of PIM whitelist files against upstream NASA sources"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "requests>=2.31",
]

[project.scripts]
pim-whitelist = "pim_whitelist.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pim_whitelist"]
